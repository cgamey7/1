<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案件档案 · 作业通缉令</title>
<style>
:root{
  --accent:#ffc861;
  --glow:rgba(255,200,97,.45);
  --paper:#e6d9bb;
  --red:#c0392b;
  --mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  --cn:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
}
body.overdue{--accent:#ff5b47;--glow:rgba(255,91,71,.55);}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:30px 18px;overflow-x:hidden;color:var(--paper);font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(ellipse 80% 55% at 50% 0%, rgba(255,200,97,.08), transparent 65%),
    radial-gradient(ellipse 70% 55% at 50% 110%, rgba(255,110,60,.05), transparent 65%),
    #0a0806;
}
.noise,.scan{position:fixed;inset:0;pointer-events:none;}
.noise{z-index:9;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");}
.scan{z-index:8;background:repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);}
.file{
  position:relative;width:min(760px,100%);padding:clamp(22px,4.5vw,44px);
  border:1px solid rgba(230,217,187,.22);
  background:linear-gradient(160deg, rgba(230,217,187,.045), rgba(230,217,187,.008));
  box-shadow:0 0 70px rgba(0,0,0,.85), inset 0 0 90px rgba(0,0,0,.55);
  animation:in .9s ease-out both;
}
@keyframes in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.file::before,.file::after{content:'';position:absolute;width:26px;height:26px;border:2px solid var(--accent);opacity:.45;transition:border-color .4s;}
.file::before{top:-1px;left:-1px;border-right:0;border-bottom:0;}
.file::after{bottom:-1px;right:-1px;border-left:0;border-top:0;}
.stamp{position:absolute;top:14px;right:-8px;transform:rotate(-11deg);padding:6px 12px;border:2.5px solid var(--red);border-radius:3px;color:var(--red);font-family:var(--cn);font-weight:700;font-size:15px;letter-spacing:.35em;text-indent:.35em;opacity:.82;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(192,57,43,.35);}
.topbar{display:flex;justify-content:space-between;gap:12px;padding-right:86px;font-size:11px;letter-spacing:.16em;color:rgba(230,217,187,.5);}

.setup{margin:18px 0 0;border:1px solid rgba(230,217,187,.18);background:rgba(0,0,0,.25);}
.setup-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:none;border:0;color:rgba(230,217,187,.7);font-family:var(--mono);font-size:11px;letter-spacing:.24em;cursor:pointer;transition:color .2s, background .2s;}
.setup-toggle:hover{color:var(--accent);background:rgba(255,200,97,.05);}
.chev{transition:transform .25s;font-size:12px;}
.setup.open .chev{transform:rotate(180deg);}
.setup-body{display:none;padding:4px 14px 16px;}
.setup.open .setup-body{display:block;}
.field{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;margin-top:12px;}
.field label{font-size:11px;letter-spacing:.14em;color:rgba(230,217,187,.5);}
.field input{width:100%;padding:8px 10px;background:rgba(0,0,0,.45);border:1px solid rgba(230,217,187,.25);border-radius:2px;color:#f0e4c8;font-family:var(--mono);font-size:14px;color-scheme:dark;outline:none;transition:border-color .2s, box-shadow .2s;}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,200,97,.12);}
.field input::placeholder{color:rgba(230,217,187,.25);}
.setup-actions{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;padding:10px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;border-radius:2px;cursor:pointer;transition:all .2s;}
.btn:disabled{opacity:.6;cursor:default;}
.btn-primary{background:rgba(255,200,97,.12);border:1px solid var(--accent);color:var(--accent);}
.btn-primary:hover:not(:disabled){background:var(--accent);color:#0a0806;}
.btn-ghost{background:transparent;border:1px solid rgba(230,217,187,.2);color:rgba(230,217,187,.55);}
.btn-ghost:hover{border-color:rgba(230,217,187,.45);color:var(--paper);}
.setup-note{margin:14px 0 0;font-size:10.5px;line-height:1.7;letter-spacing:.05em;color:rgba(230,217,187,.35);}

.title{margin:26px 0 6px;font-family:var(--cn);font-size:clamp(26px,6.2vw,44px);font-weight:700;letter-spacing:.16em;text-indent:.16em;text-align:center;color:#f3e8cd;text-shadow:0 2px 0 rgba(0,0,0,.7), 0 0 30px rgba(255,200,97,.12);}
.subtitle{margin:0 0 26px;text-align:center;font-size:10px;letter-spacing:.34em;text-indent:.34em;color:rgba(230,217,187,.38);}
.status{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;letter-spacing:.28em;text-indent:.28em;color:var(--accent);transition:color .3s;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1.7s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.25;transform:scale(.7);}}
.clock{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.6vw,16px);margin:18px 0 0;}
body.overdue .clock{animation:shake 2.6s ease-in-out infinite;}
@keyframes shake{0%,100%{transform:translate(0,0);}25%{transform:translate(-1.5px,.5px);}50%{transform:translate(1px,-.5px);}75%{transform:translate(-.5px,-1px);}}
.unit{display:flex;flex-direction:column;align-items:center;gap:10px;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(46px,14.5vw,106px);font-weight:700;line-height:1;color:var(--accent);text-shadow:0 0 10px var(--glow), 0 0 42px var(--glow);}
.num.pop{animation:pop .28s ease-out;}
@keyframes pop{0%{transform:translateY(-7px);opacity:.35;}100%{transform:translateY(0);opacity:1;}}
.lab{font-size:10px;letter-spacing:.4em;text-indent:.4em;color:rgba(230,217,187,.35);}
.colon{font-family:var(--mono);font-size:clamp(34px,10vw,78px);line-height:1;color:var(--accent);transform:translateY(-8px);animation:blink 2s steps(1,end) infinite;}
@keyframes blink{0%,50%{opacity:.5;}50.01%,100%{opacity:.1;}}
.clock-sub{margin-top:16px;text-align:center;font-size:11px;letter-spacing:.34em;text-indent:.34em;color:rgba(230,217,187,.4);}
.progress{position:relative;max-width:520px;height:4px;margin:26px auto 8px;background:rgba(230,217,187,.1);overflow:hidden;}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#7a5c22,var(--accent));box-shadow:0 0 12px var(--glow);transition:width .3s linear;}
.ptext{text-align:center;font-size:11px;letter-spacing:.18em;color:rgba(230,217,187,.45);}
.next{display:none;margin:20px auto 0;max-width:520px;padding:10px 14px;text-align:center;font-size:12px;letter-spacing:.06em;color:rgba(255,200,151,.85);border:1px dashed rgba(255,200,151,.35);background:rgba(255,120,60,.05);}
.next b{font-family:var(--mono);font-size:15px;color:#ffd9a0;}
.meta{margin:30px 0 0;padding:18px 0 0;border-top:1px dashed rgba(230,217,187,.2);display:grid;gap:11px;font-size:12.5px;line-height:1.6;}
.meta .row{display:grid;grid-template-columns:76px 1fr;gap:14px;}
.meta dt{color:rgba(230,217,187,.42);letter-spacing:.14em;white-space:nowrap;}
.meta dd{margin:0;color:#ded0ae;}
.meta dd em{font-style:normal;color:#ff9d7a;}
.quip{margin-top:26px;min-height:1.5em;text-align:center;font-family:var(--cn);font-size:14px;letter-spacing:.08em;color:#c9b98f;opacity:0;transition:opacity .45s ease;}

/* ===== 角落分享印章 ===== */
.share-seal{
  position:absolute;
  right:22px;
  bottom:22px;
  width:74px;
  height:74px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px dashed rgba(230,217,187,.16);
  border-radius:50%;
  background:transparent;
  color:rgba(230,217,187,.24);
  font-family:var(--cn);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.16em;
  line-height:1.7;
  cursor:pointer;
  transform:rotate(-9deg);
  transition:color .4s, border-color .4s, background .4s, transform .4s, box-shadow .4s;
  outline:none;
  z-index:3;
  -webkit-tap-highlight-color:transparent;
}
.share-seal::before{
  content:'';
  position:absolute;
  inset:6px;
  border:1px solid rgba(230,217,187,.08);
  border-radius:50%;
  transition:border-color .4s;
}
.share-seal:hover{
  color:var(--accent);
  border-color:rgba(255,200,97,.4);
  background:rgba(255,200,97,.04);
  transform:rotate(-9deg) scale(1.05);
  box-shadow:0 0 26px rgba(255,200,97,.1);
}
.share-seal:hover::before{border-color:rgba(255,200,97,.2);}
.share-seal:active{transform:rotate(-9deg) scale(.98);}
.share-seal.done{
  color:var(--accent);
  border-color:rgba(255,200,97,.5);
  background:rgba(255,200,97,.06);
}

/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:12px 22px;
  background:rgba(255,200,97,.15);
  border:1px solid var(--accent);
  color:var(--accent);
  font-family:var(--mono);
  font-size:13px;letter-spacing:.1em;
  border-radius:2px;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
  z-index:100;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="noise"></div>
<div class="scan"></div>

<main class="file">
  <div class="stamp">绝密</div>

  <div class="topbar">
    <span>档案编号 / NO.&nbsp;<span id="caseno">2026-0000</span></span>
    <span id="dateStr">2026.00.00</span>
  </div>

  <section class="setup" id="setup">
    <button class="setup-toggle" id="btnToggle">
      <span>⚙ 侦 查 设 定 · 点 击 修 改 截 止 时 刻</span>
      <span class="chev">▾</span>
    </button>
    <div class="setup-body">
      <div class="field"><label>截止日期</label><input type="date" id="inDate"></div>
      <div class="field"><label>截止时间</label><input type="time" id="inTime"></div>
      <div class="field"><label>涉案对象</label><input type="text" id="inName" placeholder="某位同学（可留空）" maxlength="12"></div>
      <div class="setup-actions">
        <button class="btn btn-primary" id="btnApply">确 认 归 案 时 刻</button>
        <button class="btn btn-ghost" id="btnCancel">取 消</button>
      </div>
      <p class="setup-note">设定完成后，点右下角的「分发此卷」角章，链接会自动复制好，粘贴到群里即可。</p>
    </div>
  </section>

  <h1 class="title">作 业 通 缉 令</h1>
  <p class="subtitle">THE HOMEWORK IS STILL OUT THERE</p>

  <div class="status">
    <span class="dot"></span>
    <span id="statusText">侦 查 中</span>
  </div>

  <div class="clock">
    <div class="unit"><div class="num" id="hh">00</div><div class="lab">时</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="num" id="mm">00</div><div class="lab">分</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="num" id="ss">00</div><div class="lab">秒</div></div>
  </div>

  <div class="clock-sub" id="clockSub">↑ 剩 余 时 间 ↑</div>

  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="ptext" id="ptext">加载中…</div>

  <div class="next" id="nextWrap">
    下一班次 · <span id="nextLabel">—</span> —— 还剩 <b id="nextTime">00:00:00</b>
  </div>

  <dl class="meta">
    <div class="row"><dt>截止时间</dt><dd id="deadlineText">—</dd></div>
    <div class="row"><dt>涉案对象</dt><dd id="subject">某位同学</dd></div>
    <div class="row"><dt>涉案物品</dt><dd>一份本该在截止前交上的作业</dd></div>
    <div class="row"><dt>案情摘要</dt><dd id="summaryText">—</dd></div>
  </dl>

  <div class="quip" id="quip"></div>

  <!-- 角落分享印章 -->
  <button class="share-seal" id="btnShare" title="分发此卷 · 复制分享链接" aria-label="复制分享链接">分 发<br>此 卷</button>
</main>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const DEFAULT_H = 14;
  const DEFAULT_M = 0;
  const LS_KEY = 'hw-detective-deadline';

  const hhEl=$('hh'), mmEl=$('mm'), ssEl=$('ss');
  const bar=$('bar'), ptext=$('ptext');
  const statusText=$('statusText'), clockSub=$('clockSub');
  const nextWrap=$('nextWrap'), nextTime=$('nextTime'), nextLabel=$('nextLabel');
  const quip=$('quip');
  const setup=$('setup'), btnToggle=$('btnToggle');
  const inDate=$('inDate'), inTime=$('inTime'), inName=$('inName');
  const btnApply=$('btnApply'), btnCancel=$('btnCancel');
  const btnShare=$('btnShare');

  function fmtDateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function fmtTimeKey(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
  function fmtDateFull(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
  function fmtHM(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
  function fmtClock(ms){const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60);}
  function parseDateTime(dv,tv){
    if(!dv||!tv)return null;
    const dp=dv.split('-').map(Number), tp=tv.split(':').map(Number);
    if(dp.length!==3||tp.length<2)return null;
    const [y,m,d]=dp,[hh,mm]=tp;
    if(!y||!m||!d||isNaN(hh)||isNaN(mm))return null;
    const dt=new Date(y,m-1,d,hh,mm,0,0);
    return isNaN(dt.getTime())?null:dt;
  }

  const params = new URLSearchParams(location.search);
  const state = { target:null, name:'' };
  let fromUrl=false, fromLS=false;

  function defaultTarget(){
    const n=new Date();
    let t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),DEFAULT_H,DEFAULT_M,0,0);
    if(t-n<0)t=new Date(t.getTime()+864e5);
    return t;
  }

  const uTarget = parseDateTime(params.get('d'), params.get('t'));
  if(uTarget){state.target=uTarget;fromUrl=true;}
  if(params.get('name'))state.name=params.get('name');

  if(!fromUrl){
    try{
      const raw=localStorage.getItem(LS_KEY);
      if(raw){
        const o=JSON.parse(raw);
        const t=parseDateTime(o.d,o.t);
        if(t){state.target=t;fromLS=true;if(!state.name&&o.name)state.name=o.name;}
      }
    }catch(e){}
  }
  if(!state.target)state.target=defaultTarget();

  function setNum(el,val){
    if(el.textContent!==val){el.textContent=val;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  }

  function render(){
    const now=new Date();
    const target=state.target;
    const diff=now-target;
    const overdue=diff>0;
    const ms=Math.abs(diff);
    const t=Math.floor(ms/1000);
    setNum(hhEl,pad(Math.floor(t/3600)));
    setNum(mmEl,pad(Math.floor(t%3600/60)));
    setNum(ssEl,pad(t%60));
    document.body.classList.toggle('overdue',overdue);

    $('caseno').textContent=target.getFullYear()+'-'+pad(target.getMonth()+1)+pad(target.getDate());
    $('dateStr').textContent=target.getFullYear()+'.'+pad(target.getMonth()+1)+'.'+pad(target.getDate());
    $('deadlineText').textContent=fmtDateFull(target)+' '+fmtHM(target);
    $('summaryText').innerHTML='该作业于今日凌晨被目击，此后踪迹全无。侦查员已在 <em>'+fmtDateFull(target)+' '+fmtHM(target)+'</em> 处设卡，逾时不候。';
    $('subject').textContent=state.name?state.name+' 同学':'某位同学';

    if(overdue){
      const next=new Date(target.getTime()+864e5);
      statusText.textContent='已 逾 期 · 嫌 疑 人 仍 未 归 案';
      clockSub.textContent='↑ 逃 逸 时 长 ↑';
      nextWrap.style.display='block';
      nextLabel.textContent=fmtDateFull(next)+' '+fmtHM(next);
      nextTime.textContent=fmtClock(next-now);
    }else{
      statusText.textContent='侦 查 中 · 距 离 截 止';
      clockSub.textContent='↑ 剩 余 时 间 ↑';
      nextWrap.style.display='none';
    }

    const WIN=24*3600*1000;
    const remaining=target-now;
    let prog,txt;
    if(overdue){prog=1;txt='最后 24 小时已耗尽 · 全 线 逾 期';}
    else if(remaining>WIN){
      prog=0;
      const days=Math.floor(remaining/(24*3600*1000));
      const hrs=Math.floor((remaining%(24*3600*1000))/3600000);
      txt='距离截止还有 '+days+' 天 '+hrs+' 小时';
    }else{
      prog=1-remaining/WIN;
      txt='最后 24 小时已消耗 '+(prog*100).toFixed(1)+'%';
    }
    bar.style.width=(prog*100).toFixed(2)+'%';
    ptext.textContent=txt;
  }

  function save(){
    const payload={d:fmtDateKey(state.target),t:fmtTimeKey(state.target),name:state.name||''};
    try{localStorage.setItem(LS_KEY,JSON.stringify(payload));}catch(e){}
    const p=new URLSearchParams();
    p.set('d',payload.d);p.set('t',payload.t);
    if(payload.name)p.set('name',payload.name);
    try{history.replaceState(null,'','?'+p.toString());}catch(e){}
  }

  function openSetup(){
    inDate.value=fmtDateKey(state.target);
    inTime.value=fmtTimeKey(state.target);
    inName.value=state.name||'';
    setup.classList.add('open');
  }
  function closeSetup(){setup.classList.remove('open');}

  btnToggle.addEventListener('click',function(){
    if(setup.classList.contains('open'))closeSetup();else openSetup();
  });
  btnCancel.addEventListener('click',closeSetup);

  btnApply.addEventListener('click',function(){
    const dv=inDate.value,tv=inTime.value;
    if(!dv||!tv){alert('请先选择截止日期和时间');return;}
    const nt=parseDateTime(dv,tv);
    if(!nt){alert('日期或时间格式不对，请重新选择');return;}
    state.target=nt;
    state.name=inName.value.trim();
    save();
    render();
    closeSetup();
    const old=btnApply.textContent;
    btnApply.textContent='已 更 新 ✓';
    btnApply.disabled=true;
    setTimeout(function(){btnApply.textContent=old;btnApply.disabled=false;},1200);
  });

  /* ---------- 分享 ---------- */
  function showToast(msg){
    const el=document.createElement('div');
    el.className='toast';
    el.textContent=msg;
    document.body.appendChild(el);
    requestAnimationFrame(function(){el.classList.add('show');});
    setTimeout(function(){
      el.classList.remove('show');
      setTimeout(function(){el.remove();},300);
    },2200);
  }

  function copyText(text,ok,fail){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(function(){fallback();});
    }else{fallback();}
    function fallback(){
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();
      let ok2=false;
      try{ok2=document.execCommand('copy');}catch(e){}
      document.body.removeChild(ta);
      if(ok2)ok();else fail&&fail();
    }
  }

  let sealTimer=null;
  function sealFeedback(){
    btnShare.classList.add('done');
    const original=btnShare.innerHTML;
    btnShare.innerHTML='已 复<br>制 ✓';
    clearTimeout(sealTimer);
    sealTimer=setTimeout(function(){
      btnShare.innerHTML=original;
      btnShare.classList.remove('done');
    },2000);
  }

  btnShare.addEventListener('click',function(){
    save();
    const url=location.href;

    if(navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){
      navigator.share({
        title:'作业通缉令',
        text:'你的作业还在逃，速看通缉令',
        url:url
      }).catch(function(){/* 用户取消 */});
      return;
    }

    copyText(url,function(){
      showToast('✓ 链接已复制，去群里粘贴吧');
      sealFeedback();
    },function(){
      prompt('请手动复制下面的链接：',url);
    });
  });

  /* ---------- 启动 ---------- */
  render();
  setInterval(render,200);

  if(!fromUrl&&!fromLS)setTimeout(openSetup,700);

  const quips=[
    '侦查员已在截止时刻设下埋伏……',
    '每一秒，都是一条正在逃跑的线索。',
    '证据显示：嫌疑人的作业至今下落不明。',
    '案卷上写着——「逾时不候，务必归案」。',
    '别让时针，成为你的共犯。'
  ];
  let qi=-1;
  function rotate(){
    qi=(qi+1)%quips.length;
    quip.style.opacity=0;
    setTimeout(function(){quip.textContent=quips[qi];quip.style.opacity=1;},420);
  }
  rotate();
  setInterval(rotate,4600);
})();
</script>
</body>
</html>
